[project]
name = "gcorp"
version = "0.2.0"
description = "Pre-check city air policy: a verified council of agents, a deterministic simulator, a provenance ledger."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.143", "uvicorn>=0.38", "pydantic>=2.14", "httpx>=0.28", "rich>=14", "pyyaml>=6"]

[project.scripts]
gcorp = "gcorp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gcorp*"]

[tool.setuptools.package-data]
gcorp = ["data/*.json", "council/roles/*.md", "council/stages/*.md"]
